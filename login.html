<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Learnora</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

    
    <!-- Left Side: Visual -->
    <div class="auth-left">
        <img src="images/auth-bg.jpg" alt="Learnora Background" class="auth-left-image">
        
        <a href="index.html" class="auth-back-btn">Back to Home</a>
        
        <a href="index.html" class="auth-logo">

            <img src="images/learnora_logo.jpg" alt="Learnora Logo">
        </a>
        
        <div class="auth-left-content">
            <h2 class="auth-quote">"The expert in anything was once a beginner."</h2>
            <div class="auth-author">&mdash; Helen Hayes</div>
        </div>
    </div>

    <!-- Right Side: Form -->
    <div class="auth-right">
        <div class="auth-form-wrapper">
            <div class="auth-header">
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Please enter your details to sign in.</p>
            </div>

            <div class="social-login">
                <a href="#" class="btn-social">
                    <i class="fa-brands fa-google" style="color: #DB4437; font-size: 1.2rem;"></i> Google
                </a>
                <a href="#" class="btn-social">
                    <i class="fa-brands fa-apple" style="font-size: 1.3rem;"></i> Apple
                </a>
            </div>

            <div class="auth-divider">or log in with email</div>

            <form action="#" method="POST" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <label class="form-check">
                        <input type="checkbox" checked>
                        <span>Remember for 30 days</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create account</a>
            </div>
        </div>
    </div>

    <!-- Theme toggle script -->
    <script src="js/main.js"></script>
</body>
</html>
