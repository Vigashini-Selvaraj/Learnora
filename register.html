<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Learnora</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

    
    <!-- Left Side: Visual -->
    <div class="auth-left">
        <img src="images/auth-bg.jpg" alt="Learnora Background" class="auth-left-image">
        
        <a href="index.html" class="auth-back-btn">Back to Home</a>
        
        <a href="index.html" class="auth-logo">

            <img src="images/learnora_logo.jpg" alt="Learnora Logo">
        </a>
        
        <div class="auth-left-content">
            <h2 class="auth-quote">"Education is the passport to the future."</h2>
            <div class="auth-author">&mdash; Malcolm X</div>
        </div>
    </div>

    <!-- Right Side: Form -->
    <div class="auth-right">
        <div class="auth-form-wrapper">
            <div class="auth-header" style="margin-bottom: 24px;">
                <h1 class="auth-title">Create an account</h1>
                <p class="auth-subtitle">Join 10,000+ students mastering their subjects today.</p>
            </div>

            <div class="social-login" style="margin-bottom: 24px;">
                <a href="#" class="btn-social">
                    <i class="fa-brands fa-google" style="color: #DB4437; font-size: 1.2rem;"></i> Google
                </a>
                <a href="#" class="btn-social">
                    <i class="fa-brands fa-apple" style="font-size: 1.3rem;"></i> Apple
                </a>
            </div>

            <div class="auth-divider" style="margin-bottom: 24px;">or sign up with email</div>

            <form action="#" method="POST" id="registerForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password (min. 8 characters)" required minlength="8">
                </div>
                
                <div class="form-options" style="margin-bottom: 24px;">
                    <label class="form-check">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="terms.html" class="forgot-link" target="_blank">Terms</a> &amp; <a href="privacy-policy.html" class="forgot-link" target="_blank">Privacy Policy</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn-auth">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <!-- Theme toggle script -->
    <script src="js/main.js"></script>
    <script>
        // Simple form validation for registration
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration logic would execute here!');
        });
    </script>
</body>
</html>
